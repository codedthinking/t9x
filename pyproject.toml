[project]
name = "t9x"
version = "0.1.0"
description = "Local-first, file-first workspace for coding and research agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Miklós Koren" }]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
t9x = "t9x.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t9x"]
